name: update-lvr
on:
  schedule:
    - cron: "0 3 2,12,22 * *"   # 每月 2、12、22 日 11:00（台灣）；實價登錄每月 1、11、21 日發布
  workflow_dispatch:
concurrency:
  group: build-listings
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lvr.py
      # bot 的 commit 不會觸發 build-listings，所以這裡直接重建行情頁
      - run: pip install python-pptx pillow openai
      - run: sudo apt-get install -y -q fonts-noto-cjk >/dev/null
      - run: python scripts/build.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: update 實價登錄行情"
            git pull --rebase
            git push
          fi
