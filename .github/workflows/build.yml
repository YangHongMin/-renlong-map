name: build-listings
on:
  push:
    paths:
      - "pptx/**"
      - "scripts/build.py"
      - "data/listings.json"
      - "data/posts/**"
concurrency:
  group: build-listings
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-pptx pillow openai
      - run: sudo apt-get install -y -q fonts-noto-cjk >/dev/null
      - run: python scripts/build.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "auto: update listings"
            git pull --rebase
            git push
          fi
