<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{

html,body{height:100%;overflow:hidden;}
body{font-family:-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;}
.nav{background:var(--sf);border-bottom:1px solid var(--bd);height:46px;display:flex;align-items:center;padding:0 12px;gap:8px;flex-shrink:0;}
.nav-title{font-size:14px;font-weight:700;color:var(--ac);flex:1;}
.nav-link{background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;color:var(--tx2);cursor:pointer;text-decoration:none;white-space:nowrap;}

.sdot{width:8px;height:8px;border-radius:50%;background:var(--U);cursor:pointer;flex-shrink:0;}
.sdot.ok{background:var(--V);} .sdot.loading{background:var(--C);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.tbar{background:var(--sf);border-bottom:1px solid var(--bd);padding:6px 10px;display:flex;gap:6px;align-items:center;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;}

.tb.del-btn.active{background:var(--B);border-color:var(--B);color:#fff;}
.tb.green{background:rgba(46,204,143,.12);border-color:var(--V);color:var(--V);}
.tb.warn{background:rgba(240,165,0,.12);border-color:var(--C);color:var(--C);}
.divider{width:1px;height:22px;background:var(--bd);flex-shrink:0;}
.del-cnt{background:var(--B);color:#fff;border-radius:10px;padding:1px 6px;font-size:10px;font-weight:700;margin-left:3px;}

.fbar::-webkit-scrollbar{display:none;}
.fb{flex-shrink:0;background:var(--sf2);border:1.5px solid var(--bd);border-radius:7px;padding:3px 9px;color:var(--tx2);font-size:11px;cursor:pointer;white-space:nowrap;}
.fb.active{background:var(--ac);border-color:var(--ac);color:#fff;}
#map{flex:1;position:relative;}
.bot{background:var(--sf);border-top:1px solid var(--bd);padding:5px 12px;display:flex;align-items:center;flex-shrink:0;}
.bot-txt{font-size:10px;color:var(--tx3);flex:1;}
/* Leaflet */
.leaflet-control-zoom a{background:var(--sf)!important;color:var(--tx)!important;border-color:var(--bd)!important;}
.leaflet-popup-content-wrapper{background:var(--sf)!important;color:var(--tx)!important;border:1px solid var(--bd2);border-radius:12px!important;box-shadow:0 8px 32px rgba(0,0,0,.6)!important;}
.leaflet-popup-tip{background:var(--sf)!important;}
.leaflet-popup-content{font-size:13px;line-height:1.6;margin:12px 14px!important;}
.pu-lot{font-size:17px;font-weight:800;color:var(--ac);margin-bottom:3px;}
.pu-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700;margin-bottom:7px;}
.pu-row{display:flex;gap:8px;font-size:12px;margin-bottom:3px;}
.pu-lbl{color:var(--tx2);min-width:48px;}
.pu-val{color:var(--tx);font-weight:600;}
.pu-price{color:var(--C);font-size:14px;font-weight:800;}
.pu-note{font-size:11px;color:var(--tx2);margin-top:5px;border-top:1px solid var(--bd);padding-top:4px;line-height:1.4;}
/* 地號 tooltip */
.lt{background:rgba(15,17,23,.9)!important;border:1px solid var(--bd2)!important;color:var(--tx)!important;font-size:11px!important;font-weight:600!important;border-radius:5px!important;padding:2px 7px!important;}
.lt::before{display:none!important;}
/* 圖例 */
.lgd{position:absolute;bottom:10px;right:10px;z-index:400;background:rgba(24,28,39,.92);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;box-shadow:0 4px 16px rgba(0,0,0,.5);}
.li{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--tx2);margin-bottom:3px;}
.li:last-child{margin-bottom:0;}
.ld{width:10px;height:10px;border-radius:50%;}

const SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vSoo54DLyQ_hkcfjC9vbB9zinOwhz1aaQfUIq-vuFjiKcJJiiIoiTBldICIihbThqm0JDC0ZXv5V6PE/pub?output=csv';
const DEL_KEY='renlong_del_v2';
const CLR={V:'#2ecc8f',U:'#3a4260',C:'#f0a500',R:'#9b72f5',B:'#e85d5d',S:'#38bdf8',O:'#fb923c'};
const STAT={V:'已訪問',U:'未訪問',C:'有異動',S:'已委託',R:'租賃',B:'自購',O:'其他'};

let sheetsData={}, deletedIdx=new Set(), deleteHistory=[];
let curFilter='all', mode='view';
let map, lineLayer, txtLayer;

// ── 狀態判斷 ──
function getCls(s,c){
  if(/委託/i.test(s)) return 'S';
  if(/租/i.test(c)||/租|出租/i.test(s)) return 'R';
  if(/購|買/i.test(c)||/購|買/i.test(s)) return 'B';
  if(/異動|更新/i.test(s)) return 'C';
  if(/已訪|拜訪/i.test(s)) return 'V';
  if(/銷售|出售|自用/i.test(s)) return 'O';
  return 'U';
}

// ── 文字 → 地號對應（用最近的文字標籤）──
function getLotFromText(lat,lng){
  let best=null, bestD=Infinity;
  DXF_DATA.texts.forEach(t=>{
    const d=(t.lat-lat)**2+(t.lng-lng)**2;
    if(d<bestD){bestD=d;best=t.t;}
  });
  return best;
}

// ── 地號顏色（從文字標籤位置判斷）──
function getLineColor(polyIdx){
  // 找距離此多段線中心最近的文字
  const poly=DXF_DATA.polys[polyIdx];
  const cx=poly.pts.reduce((s,p)=>s+p[0],0)/poly.pts.length;
  const cy=poly.pts.reduce((s,p)=>s+p[1],0)/poly.pts.length;
  let bestD=Infinity, bestLot=null;
  DXF_DATA.texts.forEach(t=>{
    const d=(t.lng-cx)**2+(t.lat-cy)**2;
    if(d<bestD){bestD=d;bestLot=t.t;}
  });
  if(!bestLot||bestD>0.000001) return null; // 太遠就沒有
  // 找地號
  const lots=(bestLot.match(/\d+(?:-\d+)?/g)||[]);
  for(const l of lots){
    if(sheetsData[l]) return sheetsData[l].cls;
  }
  return null;
}

function isVisible(cls){
  if(curFilter==='all') return true;
  if(curFilter==='data') return cls!==null&&cls!==undefined&&cls!=='U';
  return cls===curFilter;
}

// ── 渲染地籍線條 ──
function renderLines(){
  if(lineLayer) map.removeLayer(lineLayer);
  lineLayer=L.layerGroup();
  DXF_DATA.polys.forEach((poly,i)=>{
    if(deletedIdx.has(i)) return;
    const cls=getLineColor(i);
    if(!isVisible(cls)) return;
    const latlngs=poly.pts.map(p=>[p[1],p[0]]);
    if(latlngs.length<2) return;
    const color=cls?CLR[cls]:'#2d3860';
    const weight=cls?2:0.8;
    const opacity=cls?0.9:0.5;
    const line=L.polyline(latlngs,{color,weight,opacity,interactive:mode==='del'});
    if(mode==='del'){
      line.on('click',e=>{
        L.DomEvent.stopPropagation(e);
        deletedIdx.add(i); deleteHistory.push(i);
        saveDeleted();
        document.getElementById('del-cnt').textContent=deletedIdx.size;
        renderLines();
      });
    }
    lineLayer.addLayer(line);
  });
  lineLayer.addTo(map);
}

// ── 渲染文字標籤（地號標記，可點擊）──
function renderTexts(){
  if(txtLayer) map.removeLayer(txtLayer);
  txtLayer=L.layerGroup();
  DXF_DATA.texts.forEach(t=>{
    const lots=(t.t.match(/\d+(?:-\d+)?/g)||[]);
    // 找有無資料
    let data=null, lot=null;
    for(const l of lots){
      if(sheetsData[l]){data=sheetsData[l];lot=l;break;}
    }
    if(!lot) lot=lots[0]||t.t;
    const cls=data?data.cls:null;
    if(!isVisible(cls)&&curFilter!=='all') return;

    // 用不同大小的圓點標記
    const radius=data?5:3;
    const color=data?(CLR[data.cls]||CLR.U):'#2d3860';
    const m=L.circleMarker([t.lat,t.lng],{
      radius,color,fillColor:color,fillOpacity:data?0.8:0.3,weight:1.5,
      interactive:mode==='view'
    });
    // Tooltip 顯示地號
    m.bindTooltip(lot,{permanent:false,direction:'top',className:'lt',sticky:true});
    // 點擊顯示完整資料
    if(mode==='view'){
      m.on('click',()=>{
        if(!data){
          m.bindPopup(`<div class="pu-lot">${lot}</div><div style="color:var(--tx2);font-size:12px">此地號暫無資料</div>`,{maxWidth:220}).openPopup();
          return;
        }
        const col=CLR[data.cls]||'#9ba4be';
        m.bindPopup(`
          <div class="pu-lot">地號 ${lot}</div>
          <span class="pu-badge" style="background:${col}22;color:${col}">${STAT[data.cls]||''}</span>
          ${data.owner?`<div class="pu-row"><span class="pu-lbl">業主</span><span class="pu-val">${data.owner}</span></div>`:''}
          ${data.zone?`<div class="pu-row"><span class="pu-lbl">分區</span><span class="pu-val">${data.zone}</span></div>`:''}
          ${data.area?`<div class="pu-row"><span class="pu-lbl">面積</span><span class="pu-val">${data.area}㎡</span></div>`:''}
          ${data.tsubo?`<div class="pu-row"><span class="pu-lbl">地坪</span><span class="pu-val">${data.tsubo}坪</span></div>`:''}
          ${data.price?`<div class="pu-row"><span class="pu-lbl">開價</span><span class="pu-price">${data.price}</span></div>`:''}
          ${data.date?`<div class="pu-row"><span class="pu-lbl">日期</span><span class="pu-val">${data.date}</span></div>`:''}
          ${data.prog?`<div class="pu-note">📋 ${data.prog}</div>`:''}
          ${data.note?`<div class="pu-note">💬 ${data.note}</div>`:''}
        `,{maxWidth:260}).openPopup();
      });
    }
    txtLayer.addLayer(m);
  });
  txtLayer.addTo(map);
}

function renderAll(){ renderLines(); renderTexts(); }

// ── 模式切換 ──
function setMode(m){
  mode=m;
  document.getElementById('btn-view').classList.toggle('active',m==='view');
  document.getElementById('btn-del').classList.toggle('active',m==='del');
  map.dragging[m==='del'?'disable':'enable']();
  renderAll();
}

// ── 刪線管理 ──
function saveDeleted(){localStorage.setItem(DEL_KEY,JSON.stringify([...deletedIdx]));}
function loadDeleted(){
  try{const s=localStorage.getItem(DEL_KEY);if(s){deletedIdx=new Set(JSON.parse(s));document.getElementById('del-cnt').textContent=deletedIdx.size;}}catch(e){}
}
function undoDelete(){
  if(!deleteHistory.length){alert('沒有可還原的操作');return;}
  const last=deleteHistory.pop();
  deletedIdx.delete(last);
  saveDeleted();
  document.getElementById('del-cnt').textContent=deletedIdx.size;
  renderLines();
}
function resetDeleted(){
  if(!confirm('確定要還原所有刪除的線條嗎？')) return;
  deletedIdx.clear();deleteHistory=[];
  saveDeleted();
  document.getElementById('del-cnt').textContent=0;
  renderLines();
}

// ── CSV 解析 ──
function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/);
  const out=[];
  for(const line of lines){
    if(!line.trim()) continue;
    const cols=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'&&inQ&&line[i+1]==='"'){cur+='"';i++;}
      else if(ch==='"'){inQ=!inQ;}
      else if(ch===','&&!inQ){cols.push(cur);cur='';}
      else cur+=ch;
    }
    cols.push(cur);
    out.push(cols.map(c=>c.trim()));
  }
  return out;
}
function setSyncUI(state,txt){
  const d=document.getElementById('sdot');
  d.className='sdot'+(state==='ok'?' ok':state==='loading'?' loading':'');
  document.getElementById('stxt').textContent=txt;
}
function extractLot(pos){
  if(!pos) return null;
  const m=pos.match(/(\d{1,4}(?:-\d{1,2})?)\s*地號/)||pos.match(/\b(\d{1,4}(?:-\d{1,2})?)\b/);
  return m?m[1]:null;
}
async function syncSheets(){
  setSyncUI('loading','同步中…');
  try{
    const res=await fetch(SHEET_CSV);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const parsed=parseCSV(await res.text());
    if(parsed.length<2) throw new Error('無資料');
    const H=parsed[0];
    const col=(r,k)=>{const i=H.findIndex(h=>h.includes(k));return i>=0?r[i]||'':''};
    sheetsData={};let n=0;
    for(let i=1;i<parsed.length;i++){
      const r=parsed[i];
      if(r.every(c=>!c)) continue;
      const pos=col(r,'位置');
      const lot=extractLot(pos)||pos.trim();
      if(!lot) continue;
      sheetsData[lot]={
        owner:col(r,'所有權人'),date:col(r,'日期'),
        area:col(r,'面積'),tsubo:col(r,'地坪'),
        zone:col(r,'分區'),price:col(r,'開價'),
        note:col(r,'內容'),prog:col(r,'追蹤進度'),
        cls:getCls(col(r,'狀態'),col(r,'類別'))
      };
      n++;
    }
    const now=new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
    setSyncUI('ok',now);
    document.getElementById('bot-txt').textContent=`已同步 ${now}，${n} 筆資料`;
    renderAll();
  }catch(err){
    setSyncUI('','失敗');
    document.getElementById('bot-txt').textContent='同步失敗：'+err.message;
  }
}

// ── 篩選 ──
document.querySelectorAll('.fb').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.fb').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');curFilter=b.dataset.filter;renderAll();
}));

// ── 地圖初始化 ──
function initMap(){
  // 計算中心點
  const lats=DXF_DATA.texts.map(t=>t.lat);
  const lngs=DXF_DATA.texts.map(t=>t.lng);
  const cLat=(Math.min(...lats)+Math.max(...lats))/2;
  const cLng=(Math.min(...lngs)+Math.max(...lngs))/2;
  map=L.map('map',{center:[cLat,cLng],zoom:16});
  // 衛星底圖（地籍圖配衛星最清楚）
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {attribution:'© Esri',maxZoom:20}).addTo(map);
  // 街道標注疊加
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'© OSM',maxZoom:20,opacity:0.3}).addTo(map);
  lineLayer=L.layerGroup().addTo(map);
  txtLayer=L.layerGroup().addTo(map);
  document.getElementById('bot-txt').textContent=`地籍圖已載入：${DXF_DATA.polys.length} 條線段、${DXF_DATA.texts.length} 個地號標籤（TWD97 精確座標）`;
}

loadDeleted();
initMap();
renderAll();
setTimeout(syncSheets,800);
</script>
