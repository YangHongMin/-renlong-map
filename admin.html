<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src https://api.github.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>物件管理</title>
<style>
:root{--navy:#1e3a8a;--red:#c8302a;--blue:#0a58b0;--ink:#1f2937;--mute:#667085;--line:#dfe3e8;--bg:#f3f5f8;--ok:#1a7f4b}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
header{background:var(--navy);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;border-bottom:4px solid var(--red)}
header h1{margin:0;font-size:18px;flex:1}
header a,header button{color:#fff;background:none;border:1px solid rgba(255,255,255,.5);border-radius:5px;padding:5px 12px;font:inherit;font-size:14px;cursor:pointer;text-decoration:none}
main{max-width:760px;margin:0 auto;padding:16px}
.box{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:flex-start}
.th{width:84px;height:64px;border-radius:4px;background:#cfd5d9 center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.row h3{margin:0 0 2px;font-size:16px}.meta{color:var(--mute);font-size:13px}.price{color:var(--red);font-weight:700}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:10px;background:#e6f4ec;color:var(--ok);margin-left:6px;vertical-align:middle}
.pill.wait{background:#fff1e0;color:#b45309}
.pill.done{background:#eceff3;color:var(--mute)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
button.b,a.b{border:1px solid var(--line);background:#fff;border-radius:5px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink);text-decoration:none}
button.b.main{background:var(--blue);color:#fff;border-color:var(--blue)}
button.b.del{color:var(--red);border-color:#f0c4c1}
button:disabled{opacity:.5;cursor:wait}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid #c9ced6;border-radius:5px;background:#fff}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
dialog{border:0;border-radius:10px;padding:18px;width:min(520px,94vw);max-height:90vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:6px;font-size:14px;display:none;z-index:9;max-width:90vw}
.hint{color:var(--mute);font-size:13px}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin:10px 0}
.pg>div{border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center;font-size:12px;position:relative}
.pg img{width:100%;height:80px;object-fit:cover;border-radius:4px;display:block;margin-bottom:5px;background:#cfd5d9}
.pg button{font-size:12px;padding:3px 8px;margin:1px}
.cv{position:absolute;left:10px;top:10px;background:var(--red);color:#fff;border-radius:3px;padding:0 6px;font-size:11px}
</style>
</head>
<body>
<header><h1>物件管理</h1><a href="./" target="_blank">看網站</a><button id="out" style="display:none">登出</button></header>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div id="toast"></div>
<script>
const OWNER="YangHongMin",REPO="-renlong-map",BR="main";
const API=`https://api.github.com/repos/${OWNER}/${REPO}/contents/`;
const TK="gh_admin_token";
const ls=(f)=>{try{return f()}catch(e){return null}};
let token=ls(()=>sessionStorage.getItem(TK))||ls(()=>localStorage.getItem(TK))||"",data=[];
const $=id=>document.getElementById(id);
const CATS=["大型廠房","小型廠房","土地","其他"];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okId=s=>typeof s==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(s);
const okImg=s=>typeof s==="string"&&/^img\/[A-Za-z0-9_\-\/.]+$/.test(s)&&!s.includes("..");
function saveTok(t,remember){
  ls(()=>{sessionStorage.setItem(TK,t);remember?localStorage.setItem(TK,t):localStorage.removeItem(TK);localStorage.setItem("is_owner","1")});
}
function clearTok(){ls(()=>{sessionStorage.removeItem(TK);localStorage.removeItem(TK)});token=""}
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const b64e=s=>{let r="";new TextEncoder().encode(s).forEach(x=>r+=String.fromCharCode(x));return btoa(r)};
function toast(t,ms=3500){const e=$("toast");e.textContent=t;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",ms)}

async function gh(path,opt={}){
  const get=!opt.method||opt.method==="GET";
  const r=await fetch(API+encodeURI(path)+(get?`?ref=${BR}&_=${Date.now()}`:""),{...opt,cache:"no-store",
    headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"}});
  if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}
  return r.json();
}
async function readList(){const f=await gh("data/listings.json");return{sha:f.sha,data:JSON.parse(b64d(f.content))}}
async function mutate(fn,msg){
  for(let i=0;i<3;i++){
    const {sha,data:d}=await readList();const out=fn(d);
    try{
      await gh("data/listings.json",{method:"PUT",body:JSON.stringify({message:msg,content:b64e(JSON.stringify(out,null,2)),sha,branch:BR})});
      return out;
    }catch(e){if((e.status!==409&&e.status!==422)||i===2)throw e}
  }
}
// 一次 commit 完成「改資料＋新增/刪除多個檔案」：不管幾張照片，都只要固定幾次請求，
// 也只會觸發一次網站重建（舊作法每個檔案一個 commit，刪除物件要等十幾秒）。
const GIT="https://api.github.com/repos/"+OWNER+"/"+REPO+"/git/";
async function api(url,method="GET",body){
  const r=await fetch(url,{method,cache:"no-store",headers:{Authorization:"Bearer "+token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error("HTTP "+r.status);e.status=r.status;throw e}
  return r.json();
}
const thumbOf=p=>p.replace(/[^\/]+$/,m=>"t_"+m);
async function commit(msg,fn,adds=[],dels=[]){
  const blobs=await Promise.all(adds.map(x=>api(GIT+"blobs","POST",{content:x.b64,encoding:"base64"}).then(b=>({path:x.path,sha:b.sha}))));
  for(let i=0;i<3;i++){
    const [ref,tr,lf]=await Promise.all([api(GIT+"ref/heads/"+BR),api(GIT+"trees/"+BR+"?recursive=1"),api(API+"data/listings.json?ref="+BR+"&_="+Date.now())]);
    const out=fn(JSON.parse(b64d(lf.content)));
    const del=tr.tree.filter(t=>t.type==="blob"&&dels.some(x=>x.endsWith("/")?t.path.startsWith(x):t.path===x)).map(t=>({path:t.path,mode:"100644",type:"blob",sha:null}));
    const items=[{path:"data/listings.json",mode:"100644",type:"blob",content:JSON.stringify(out,null,2)},
      ...blobs.map(b=>({path:b.path,mode:"100644",type:"blob",sha:b.sha})),...del];
    const nt=await api(GIT+"trees","POST",{base_tree:tr.sha,tree:items});
    const nc=await api(GIT+"commits","POST",{message:msg,tree:nt.sha,parents:[ref.object.sha]});
    try{await api(GIT+"refs/heads/"+BR,"PATCH",{sha:nc.sha,force:false});return out}
    catch(e){if((e.status!==422&&e.status!==409)||i===2)throw e}
  }
}
// 樂觀更新：先改畫面、背景存檔（依序排隊）；失敗就從 GitHub 重新載入。
let q=Promise.resolve(),pending=0;
function bg(label,local,server){
  local();render();pending++;toast(label+"（同步中…）",60000);
  q=q.then(async()=>{
    try{const out=await server();if(pending===1)data=out;toast("已儲存，約 1 分鐘後網站更新")}
    catch(e){toast("失敗："+e.message+(e.status===403||e.status===401?"（權限不足或 token 失效）":"")+"，已重新載入",7000);
      try{data=(await readList()).data}catch(_){}}
    finally{pending--;render()}
  });
}

function login(){
  $("out").style.display="none";
  $("app").innerHTML=`<div class="box"><h3 style="margin-top:0">連線到 GitHub</h3>
   <p class="hint">貼上專用的 GitHub token（只授權這個 repo 的 Contents 讀寫）。預設只在這個分頁有效，關閉分頁就會清除；請勿在公用電腦使用。</p>
   <label>GitHub token</label><input id="tk" type="password" placeholder="github_pat_..." autocomplete="off">
   <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="rm" type="checkbox" style="width:auto">記住這台裝置（只有自己的私人裝置才勾選）</label>
   <div class="btns"><button class="b main" id="go">連線</button></div></div>`;
  $("go").onclick=async()=>{token=$("tk").value.trim();if(!token)return;
    try{await readList();saveTok(token,$("rm").checked);start()}
    catch(e){token="";toast(e.status===401||e.status===403?"token 無效或權限不足":"連線失敗："+e.message)}};
}
async function start(){
  $("out").style.display="";$("app").innerHTML='<p class="hint">載入中…</p>';
  try{data=(await readList()).data;ls(()=>localStorage.setItem("is_owner","1"));render()}
  catch(e){if(e.status===401||e.status===403){clearTok();login();toast("token 已失效，請重新貼上")}else $("app").innerHTML='<p>載入失敗：'+esc(e.message)+'</p>'}
}
function render(){
  const L=data.filter(l=>l&&okId(l.id)),bad=data.length-L.length;
  const n=L.filter(l=>l.status==="上架").length,w=L.filter(l=>l.status==="待確認").length,d=L.length-n-w;
  const rank=l=>l.status==="待確認"?0:1;
  const rows=[...L].sort((x,y)=>rank(x)-rank(y));
  $("app").innerHTML=`<p class="hint">共 ${L.length} 筆｜待確認 ${w}｜上架 ${n}｜已成交 ${d}。儲存後約 1 分鐘網站更新。</p>`+
  (bad?`<div class="box" style="border-left:5px solid var(--red)">有 ${bad} 筆資料編號異常，已隱藏，請檢查 listings.json。</div>`:"")+
  (w?`<div class="box" style="border-left:5px solid #e08a0a">有 ${w} 筆新物件等待確認。請先按「預覽」檢查標題、價格、照片，沒問題再按「確認上架」，確認前訪客看不到。</div>`:"")+
  (rows.map(l=>{const done=l.status==="已成交",wait=l.status==="待確認",p=(Array.isArray(l.photos)?l.photos:[]).find(okImg);
   return `<div class="box"><div class="row"><div class="th" style="${p?`background-image:url('${esc(p)}')`:""}">${p?"":"🏭"}</div>
   <div style="flex:1;min-width:0"><h3>${esc(l.title)}<span class="pill ${done?"done":wait?"wait":""}">${done?"已成交":wait?"待確認":"上架中"}</span></h3>
   <div class="meta">${esc(l.id)}｜出${esc(l.type)}｜${esc(l.category||"自動分類")}｜${esc(l.area)}</div><div class="price">${esc(l.price)}</div></div></div>
   <div class="btns"><button class="b main" onclick="toggle('${l.id}')">${wait?"確認上架":done?"重新上架":"標記已成交"}</button>
   <button class="b" onclick="edit('${l.id}')">編輯</button><button class="b" onclick="photos('${l.id}')">照片（${(Array.isArray(l.photos)?l.photos:[]).filter(okImg).length}）</button><a class="b" href="./?id=${l.id}${wait?"&preview=1":""}" target="_blank">${wait?"預覽":"查看"}</a>
   <button class="b del" onclick="remove('${l.id}')">刪除</button></div></div>`}).join("")||'<div class="box">目前沒有物件</div>');
}
const find=id=>data.find(x=>x.id===id);
const toggle=id=>bg("更新狀態",()=>{const l=find(id);l.status=l.status==="上架"?"已成交":"上架"},
  ()=>mutate(d=>{const l=d.find(x=>x.id===id);l.status=l.status==="上架"?"已成交":"上架";return d},"status "+id));
function edit(id){
  const l=data.find(x=>x.id===id);
  const f=(k,lab,tag)=>`<label>${lab}</label>${tag==="ta"?`<textarea id="f_${k}" rows="3">${esc(l[k])}</textarea>`:`<input id="f_${k}" value="${esc(l[k])}">`}`;
  $("dlg").innerHTML=`<h3 style="margin-top:0">編輯 ${esc(id)}</h3>
   <label>分類</label><select id="f_category">${CATS.map(c=>`<option ${l.category===c?"selected":""}>${c}</option>`).join("")}<option value="" ${CATS.includes(l.category)?"":"selected"}>（自動判斷）</option></select>
   <label>售 / 租</label><select id="f_type"><option ${l.type==="售"?"selected":""}>售</option><option ${l.type==="租"?"selected":""}>租</option></select>
   ${f("title","標題")}${f("price","價格")}${f("area","地址（只到路名）")}${f("zoning","使用分區")}
   ${f("land_ping","土地坪數")}${f("build_ping","建物坪數")}${f("note","備註","ta")}${f("desc","特色（用「；」分隔）","ta")}
   <div class="btns"><button class="b main" id="sv">儲存</button><button class="b" onclick="$('dlg').close()">取消</button></div>`;
  $("dlg").showModal();
  $("sv").onclick=()=>{const v={};["category","type","title","price","area","zoning","land_ping","build_ping","note","desc"].forEach(k=>v[k]=$("f_"+k).value.trim());
    $("dlg").close();
    bg("儲存",()=>Object.assign(find(id),v),()=>mutate(d=>{Object.assign(d.find(x=>x.id===id),v);return d},"edit "+id))};
}

const pv={};
function mkJpeg(bm,max,qual){
  const k=Math.min(1,max/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",qual);
}
function photos(id){
  const l=find(id);if(!l)return;
  const P=(Array.isArray(l.photos)?l.photos:[]).filter(okImg);
  $("dlg").innerHTML=`<h3 style="margin-top:0">照片管理 ${esc(id)}（${P.length} 張）</h3>
   <p class="hint">第一張是封面。刪除會連檔案一起刪除，無法復原。新增的照片會自動縮到適合網頁的大小。</p>
   <div class="pg">${P.map((p,i)=>`<div>${i?"":'<span class="cv">封面</span>'}<img src="${esc(pv[p]||thumbOf(p))}" data-o="${esc(p)}" alt="">
     ${i?`<button class="b" data-a="cover" data-i="${i}">設為封面</button>`:""}<button class="b del" data-a="del" data-i="${i}">刪除</button></div>`).join("")||'<p class="hint">目前沒有照片</p>'}</div>
   <label>新增照片（可一次選多張）</label><input id="pf" type="file" accept="image/*" multiple>
   <div class="btns"><button class="b main" id="pu">上傳</button><button class="b" id="pc">關閉</button></div>`;
  if(!$("dlg").open)$("dlg").showModal();
  $("pc").onclick=()=>$("dlg").close();
  $("dlg").querySelectorAll(".pg img").forEach(im=>im.onerror=()=>{if(im.dataset.o&&im.src.indexOf("/t_")>-1)im.src=im.dataset.o});
  $("dlg").querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i,p=P[i];
    if(b.dataset.a==="del"){
      if(!confirm("確定刪除這張照片？無法復原。"))return;
      bg("刪除照片",()=>{find(id).photos=find(id).photos.filter(q=>q!==p)},
        ()=>commit("photo del "+id,d=>{const x=d.find(y=>y.id===id);x.photos=(x.photos||[]).filter(q=>q!==p);return d},[],[p,thumbOf(p)]));
    }else{
      bg("設為封面",()=>{find(id).photos=[p,...find(id).photos.filter(q=>q!==p)]},
        ()=>mutate(d=>{const x=d.find(y=>y.id===id);x.photos=[p,...(x.photos||[]).filter(q=>q!==p)];return d},"photo cover "+id));
    }
    photos(id);
  });
  $("pu").onclick=async()=>{
    const fs=[...$("pf").files];if(!fs.length)return toast("請先選擇照片");
    toast("處理照片中…",60000);$("pu").disabled=true;
    const added=[],adds=[];
    try{
      for(const f of fs){
        const bm=await createImageBitmap(f),full=mkJpeg(bm,1600,0.82),th=mkJpeg(bm,480,0.72),path=`img/${id}/u${Date.now()}${added.length}.jpg`;
        adds.push({path,b64:full.split(",")[1]},{path:thumbOf(path),b64:th.split(",")[1]});pv[path]=th;added.push(path);
      }
    }catch(e){toast("照片處理失敗："+e.message,6000);$("pu").disabled=false;return}
    bg("上傳照片（"+fs.length+" 張）",()=>{find(id).photos=[...(find(id).photos||[]),...added]},
      ()=>commit("photo add "+id,d=>{const x=d.find(y=>y.id===id);x.photos=[...(x.photos||[]),...added];return d},adds));
    photos(id);
  };
}
function remove(id){
  const l=find(id);
  if(!confirm(`確定要刪除「${l.title}」嗎？\n會一併刪除照片，無法復原。\n（只是成交的話，請改用「標記已成交」）`))return;
  bg("刪除",()=>{data=data.filter(x=>x.id!==id)},()=>commit("delete "+id,d=>d.filter(x=>x.id!==id),[],["img/"+id+"/","p/"+id+".html"]));
}
$("out").onclick=()=>{clearTok();login()};
token?start():login();
</script>
</body>
</html>
