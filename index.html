<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#1e3a8a;--red:#c8302a;--orange:#e08a0a;--blue:#0a58b0;--ink:#1f2937;--mute:#667085;--line:#dfe3e8;--bg:#f3f5f8}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit}
header{background:var(--navy);border-bottom:4px solid var(--red)}
.bar{max-width:1000px;margin:0 auto;padding:14px 20px 6px}
.bar img{height:36px;max-width:100%;display:block}
nav{max-width:1000px;margin:0 auto;padding:0 20px 10px;display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
nav a{color:#fff;text-decoration:none;opacity:.85}nav a.on{opacity:1;font-weight:700;border-bottom:2px solid #fff}
main{max-width:1000px;margin:0 auto;padding:20px}
h1{font-size:22px;margin:0 0 14px;color:var(--navy);font-weight:900}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;margin-bottom:18px}
.panel label{color:var(--red);font-weight:700;font-size:15px}
.panel select,.panel input{font:inherit;padding:7px 10px;border:1px solid #c9ced6;border-radius:5px;background:#fff}
.panel button{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:8px 20px;font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden;text-decoration:none;display:block}
.ph{aspect-ratio:4/3;background:#cfd5d9 center/cover;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative}
.tag{position:absolute;left:0;top:12px;background:var(--red);color:#fff;font-size:13px;font-weight:700;padding:2px 12px}
.tag.rent{background:var(--blue)}.tag.done{background:var(--mute)}
.info{padding:14px 16px}.info h3{margin:0 0 4px;font-size:17px}
.meta{color:var(--mute);font-size:14px}.price{font-weight:900;font-size:20px;color:var(--red);margin-top:6px}
table{width:100%;border-collapse:collapse;background:#fff;margin:16px 0;border:1px solid var(--line)}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{width:28%;color:var(--navy);font-weight:700;background:#f7f8fb}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.join{display:flex;gap:20px;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-left:5px solid #06c755;border-radius:8px;padding:20px;margin-top:24px}
.join h3{margin:0 0 6px;font-size:18px;color:var(--navy)}.join p{margin:0 0 12px;color:var(--mute);font-size:15px}
.join .qr{width:128px;height:128px;flex:none}
.btn.fb{background:#1877f2}
@media(max-width:1100px){.join{padding-right:80px}}
@media(max-width:700px){.join{padding-right:20px}.join .qr{display:none}}
.back{display:inline-block;margin-bottom:10px;color:var(--blue);text-decoration:none}
.contact{display:flex;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-left:5px solid var(--red);border-radius:6px;padding:16px;margin:18px 0;flex-wrap:wrap}
.contact img{width:84px;height:96px;object-fit:cover;border-radius:4px}
.contact b{font-size:18px}.contact .sub{color:var(--mute);font-size:14px}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.btn{padding:10px 20px;border-radius:5px;color:#fff;text-decoration:none;font-weight:700}
.btn.line{background:#06c755}.btn.tel{background:var(--navy)}
.fab{position:fixed;right:14px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:5}
.fab a{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;font-weight:700;font-size:13px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.fab .s{background:var(--orange);font-size:20px}.fab .l{background:#06c755}.fab .t{background:#2a6aa8;font-size:22px}
#smenu{display:none;position:fixed;right:76px;bottom:20px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.2);padding:6px;z-index:6}
#smenu a{display:block;padding:9px 18px;text-decoration:none;color:var(--ink);font-size:15px;border-radius:5px;cursor:pointer}#smenu a:hover{background:var(--bg)}
#toast{display:none;position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:5px;font-size:14px;z-index:9}
.need{background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:8px;padding:20px;margin-top:24px}
.need h3{margin:0 0 6px;font-size:18px;color:var(--navy)}.need p{margin:0 0 14px;color:var(--mute);font-size:15px}
.ng{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.need label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.need input,.need select,.need textarea{font:inherit;color:var(--ink);padding:8px 10px;border:1px solid #c9ced6;border-radius:5px;background:#fff;width:100%}
.nout{margin-top:14px;padding:14px;background:#f7f8fb;border:1px solid var(--line);border-radius:6px;font-size:14px}
.nout textarea{margin-top:8px}
button.btn{border:0;cursor:pointer;font:inherit;font-weight:700}
footer{background:var(--navy);color:#dbe3f5;padding:28px 20px 40px;font-size:14px;line-height:1.9}
footer .in{max-width:1000px;margin:0 auto}footer img{height:30px;margin-bottom:10px}
footer b{color:#fff}footer a{color:#fff}
</style>
</head>
<body>
<header>
 <div class="bar"><a href="./"><img src="logo.png" alt="富住通商用不動產 大型工業地產"></a></div>
 <nav><a class="on" href="./">工業物件</a><a href="./#need" onclick="toNeed(event)">找不到合適的？</a><a href="https://fulllife5858.com.tw/analysis.aspx" target="_blank" rel="noopener">市場分析</a><a href="https://fulllife5858.com.tw/transaction.aspx" target="_blank" rel="noopener">成交指標</a><a href="https://fulllife5858.com.tw/" target="_blank" rel="noopener">公司官網</a><a href="https://www.facebook.com/profile.php?id=61573837941258" target="_blank" rel="noopener">粉絲專頁</a></nav>
</header>
<main id="app"></main>
<div id="smenu"><a onclick="sfb()">分享到 Facebook</a><a onclick="sln()">分享到 LINE</a><a onclick="scp()">複製連結</a><a id="smore" style="display:none" onclick="smore()">更多⋯</a></div>
<div class="fab"><a class="s" href="#" onclick="share(event)" aria-label="分享">⤴</a><a class="l" href="https://lin.ee/S6hfHqge" target="_blank" rel="noopener" onclick="lineGo('fab')">LINE</a><a class="t" href="tel:0905858141" aria-label="撥打電話" onclick="ev('call_click',{item_id:curId},'Contact')">☎</a></div>

 <img src="logo.png" alt="富住通商用不動產"><br>
 <b>富茂通商用不動產股份有限公司</b>（富住通商用不動產 新興店）<br>
 營業員：楊紘珉｜(114)登字第486430號<br>

 <span style="opacity:.75">關懷・家庭・文化・國際｜本網站資料僅供參考，實際內容以現場及契約為準</span><br><span style="opacity:.75;font-size:12px">本網站使用 Google Analytics 與 Meta Pixel 蒐集匿名瀏覽統計，用於了解網站使用情形與廣告成效。</span>
</div></footer>
<script>
const OWNER=(()=>{try{return localStorage.getItem("is_owner")==="1"}catch(e){return false}})(); // 管理者本人的瀏覽不計入統計（在管理頁登入時設定）
const GA_ID="G-5YXFVRJ2JM",PIXEL_ID="996673046774269";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okId=s=>typeof s==="string"&&/^[A-Za-z0-9_-]{1,40}$/.test(s);
const okImg=s=>typeof s==="string"&&/^img\/[A-Za-z0-9_\-\/.]+$/.test(s)&&s.indexOf("..")<0;
const sanitize=d=>(Array.isArray(d)?d:[]).filter(l=>l&&typeof l==="object"&&okId(l.id)).map(l=>({...l,photos:(Array.isArray(l.photos)?l.photos:[]).filter(okImg)}));
window.dataLayer=window.dataLayer||[];
function gtag(){dataLayer.push(arguments)}
if(!OWNER){
  const gs=document.createElement("script");gs.async=true;gs.src="https://www.googletagmanager.com/gtag/js?id="+GA_ID;document.head.appendChild(gs);
  gtag("js",new Date());gtag("config",GA_ID,{send_page_view:false});
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version="2.0";n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,"script","https://connect.facebook.net/en_US/fbevents.js");
  fbq("init",PIXEL_ID);fbq("track","PageView");
}
const STD=["ViewContent","Lead","Contact","PageView"];
function ev(ga,gp,fb,fp){if(OWNER)return;try{if(ga)gtag("event",ga,gp||{});if(fb)fbq(STD.includes(fb)?"track":"trackCustom",fb,fp||{})}catch(e){}}
let firstView=true;
function pageview(l){
  ev("page_view",{page_title:document.title,page_location:location.href});
  if(!firstView)ev(null,null,"PageView"); firstView=false;  // 第一次的 PageView 已由 Pixel 載入時送出
  if(l)ev("view_item",{items:[{item_id:l.id,item_name:l.title}]},"ViewContent",{content_ids:[l.id],content_name:l.title,content_type:"product"});
}
const LINE_URL="https://lin.ee/S6hfHqge",FB_URL="https://www.facebook.com/profile.php?id=61573837941258";
const joinBlock=()=>`<div class="join"><div><h3>新物件・降價通知</h3><p>加入官方 LINE，第一時間收到新上架與行情；也可以直接告訴我您的需求（區域、坪數、預算），我幫您留意。</p><div class="btns"><a class="btn line" href="${LINE_URL}" target="_blank" rel="noopener" onclick="ev('join_line_click',{item_id:curId},'Lead',{content_name:'join'})">加入 LINE 官方帳號</a><a class="btn fb" href="${FB_URL}" target="_blank" rel="noopener">追蹤 Facebook 粉絲專頁</a></div></div><img class="qr" src="line_qr.png" alt="LINE 官方帳號 QR Code"></div>`;
const needBlock=()=>`<div class="need" id="need"><h3>找不到合適的？告訴我您的需求</h3><p>填寫後會整理成一則訊息，由您確認後傳到 LINE。有符合的物件，我會第一時間通知您。不需要留電話。</p>
 <div class="ng"><label>我想<select id="n_t"><option>買廠房／土地</option><option>租廠房／土地</option><option>委託出售</option><option>委託出租</option></select></label>
 <label>區域<input id="n_a" maxlength="40" placeholder="例如：仁武、大寮、岡山" autocomplete="off"></label>
 <label>坪數<input id="n_s" maxlength="30" placeholder="例如：土地300坪左右" autocomplete="off"></label>
 <label>預算／價格<input id="n_b" maxlength="30" placeholder="例如：月租50萬內" autocomplete="off"></label>
 <label>用途<input id="n_u" maxlength="30" placeholder="例如：製造、倉儲、貨櫃場" autocomplete="off"></label>
 <label>其他需求<input id="n_m" maxlength="100" placeholder="例如：要天車、貨櫃車可進出" autocomplete="off"></label></div>
 <div class="btns"><button class="btn line" type="button" id="n_go">整理成訊息並開啟 LINE</button></div><div class="nout" id="n_out" style="display:none"></div></div>`;
let all=[],F={type:"",area:"",kw:""},msg="我想詢問工業物件";
const vis=()=>all.filter(l=>l.status!=="待確認");
const $=document.getElementById("app");
const dist=l=>(String(l.area||"").match(/[市縣](.+?[區鄉鎮市])/)||[])[1]||"";
let curId="";
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display="none",3500)}
const copy=t=>{try{return navigator.clipboard.writeText(t).then(()=>true,()=>false)}catch(e){return Promise.resolve(false)}};
function lineGo(w){copy(msg);toast("已複製物件編號，請在 LINE 貼上傳送");ev("line_click",{where:w||"page",item_id:curId},"Lead",{content_name:msg})}
const shareUrl=()=>location.origin+(curId?"/p/"+curId+".html":"/");
function share(e){e.preventDefault();const m=document.getElementById("smenu");m.style.display=m.style.display==="block"?"none":"block";document.getElementById("smore").style.display=navigator.share?"block":"none"}
function sfb(){ev("share",{method:"facebook",item_id:curId});window.open("https://www.facebook.com/sharer/sharer.php?u="+encodeURIComponent(shareUrl()),"_blank","noopener");document.getElementById("smenu").style.display="none"}
function sln(){ev("share",{method:"line",item_id:curId});window.open("https://social-plugins.line.me/lineit/share?url="+encodeURIComponent(shareUrl()),"_blank","noopener");document.getElementById("smenu").style.display="none"}
function scp(){ev("share",{method:"copy",item_id:curId});copy(shareUrl());document.getElementById("smenu").style.display="none";toast("已複製連結")}
function smore(){ev("share",{method:"native",item_id:curId});navigator.share({title:document.title,url:shareUrl()}).catch(()=>{});document.getElementById("smenu").style.display="none"}
function needGo(){
  const g=id=>document.getElementById(id).value.trim();
  const t=g("n_t"),a=g("n_a"),s=g("n_s"),b=g("n_b"),u=g("n_u"),m=g("n_m");
  if(!(a||s||b||u||m)){toast("請至少填寫一項需求");return}
  const text=["【需求登記】","我想："+t,a&&"區域："+a,s&&"坪數："+s,b&&"預算／價格："+b,u&&"用途："+u,m&&"其他需求："+m,"（來自網站 fulllife.blog）"].filter(Boolean).join("\n");
  copy(text).then(ok=>toast(ok?"已複製需求內容，請在 LINE 貼上傳送":"請手動複製下方內容，再到 LINE 貼上"));
  window.open(LINE_URL,"_blank","noopener");
  const o=document.getElementById("n_out");o.style.display="block";
  o.innerHTML='<b>需求已整理好</b><div>請到 LINE 的對話框貼上並傳送。若沒有自動複製，請手動複製：</div><textarea id="n_txt" readonly rows="7"></textarea>';
  const tx=document.getElementById("n_txt");tx.value=text;tx.onclick=()=>tx.select();
  ev("need_form_submit",{need_type:t},"NeedForm",{need_type:t}); // 只送需求類別，不送內容
}
function toNeed(e){e.preventDefault();history.pushState({},"","./#need");route()}
fetch("listings.json").then(r=>r.json()).then(d=>{all=sanitize(d);route()}).catch(()=>{$.textContent="資料載入失敗，請稍後再試。"});
window.addEventListener("popstate",route);
function route(){const q=new URLSearchParams(location.search),id=q.get("id"),pv=q.get("preview")==="1";const l=all.find(x=>x.id===id&&(x.status!=="待確認"||pv));l?detail(l):list();pageview(l)}
function go(e,id){e.preventDefault();history.pushState({},"","?id="+id);route();scrollTo(0,0)}
function home(e){e.preventDefault();history.pushState({},"","./");route()}
function list(){
  document.title="富住通大型工業地產｜高雄工業廠房";msg="我想詢問工業物件";curId="";
  const areas=[...new Set(vis().map(dist).filter(Boolean))];
  $.innerHTML=`<h1>工業廠房・工業用地</h1><div class="panel">
   <label>類別：</label><select id="ft"><option value="">不限</option><option value="售">出售</option><option value="租">出租</option></select>
   <label>區域：</label><select id="fa"><option value="">不限</option>${areas.map(a=>`<option>${esc(a)}</option>`).join("")}</select>
   <label>關鍵字：</label><input id="fk" placeholder="輸入關鍵字"><button onclick="draw()">我要查詢</button></div><div class="grid" id="grid"></div>${needBlock()}${joinBlock()}`;
  ["ft","fa"].forEach(i=>{const e=document.getElementById(i);e.value=F[i==="ft"?"type":"area"];e.onchange=draw});
  const k=document.getElementById("fk");k.value=F.kw;k.oninput=draw;draw();
  document.getElementById("n_go").onclick=needGo;
  if(location.hash==="#need")document.getElementById("need").scrollIntoView();
}
function draw(){
  F.type=document.getElementById("ft").value;F.area=document.getElementById("fa").value;F.kw=document.getElementById("fk").value.trim();
  const rows=vis().filter(l=>(!F.type||l.type===F.type)&&(!F.area||dist(l)===F.area)&&(!F.kw||[l.title,l.area,l.zoning,l.desc,l.note].join(" ").includes(F.kw)));
  document.getElementById("grid").innerHTML=rows.map(l=>{const p=(l.photos||[])[0];const done=l.status==="已成交";
   return `<a class="card" href="?id=${esc(l.id)}" onclick="go(event,'${esc(l.id)}')"><div class="ph" style="${p?`background-image:url('${esc(p)}')`:""}">${p?"":"🏭"}<span class="tag ${done?"done":l.type==="租"?"rent":""}">${done?"已成交":"出"+esc(l.type)}</span></div>
   <div class="info"><h3>${esc(l.title)}</h3><div class="meta">${esc([l.area,l.zoning,l.land_ping?"土地 "+l.land_ping+" 坪":"",l.build_ping?"建坪 "+l.build_ping+" 坪":""].filter(Boolean).join("｜"))}</div><div class="price">${esc(l.price)}</div></div></a>`}).join("")||"目前沒有符合的物件";
}
function detail(l){
  document.title=String(l.title||"")+"｜富住通大型工業地產";msg="我想詢問物件 "+l.id+"｜"+l.title;curId=l.id;
  const rows=[["編號",l.id],["區域",l.area],["價格",l.price],["使用分區",l.zoning],["基地面積",l.land_ping?l.land_ping+" 坪":""],["建物面積",l.build_ping?l.build_ping+" 坪":""],["備註",l.note]].filter(r=>r[1]);
  $.innerHTML=`<a class="back" href="./" onclick="home(event)">← 回物件列表</a><h1>${esc(l.title)}</h1>
  <div class="gal">${(l.photos||[]).map(p=>`<img src="${esc(p)}" loading="lazy" alt="${esc(l.title)}">`).join("")}</div>
  <table>${rows.map(r=>`<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("")}</table>
  <p>${String(l.desc||"").split("；").filter(Boolean).map(x=>"・"+esc(x)).join("<br>")}</p>
  ${l.status==="已成交"?"":`<div class="contact"><img src="avatar.jpg" alt="楊紘珉"><div><b>楊紘珉</b><div class="sub">富住通商用不動產｜大型工業地產</div>
   <div>0905-858-141｜0978-133-561</div><div class="btns"><a class="btn line" href="${LINE_URL}" target="_blank" rel="noopener" onclick="lineGo('detail')">LINE 詢問這個物件</a><a class="btn tel" href="tel:0905858141" onclick="ev('call_click',{item_id:curId},'Contact')">撥打電話</a></div>
   <div class="sub" style="margin-top:6px">按 LINE 會自動複製物件編號，到 LINE 貼上傳送即可。</div></div></div>`}
  <p><a href="./#need" onclick="toNeed(event)" style="color:var(--blue)">找不到合適的？告訴我您的需求</a></p>${joinBlock()}`;
}
</script>
