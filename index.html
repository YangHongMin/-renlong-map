<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工業不動產物件｜仁武・高雄</title>
<meta property="og:title" content="工業不動產物件｜仁武・高雄">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1f2a33;--steel:#2f4b5c;--line:#d5d9dc;--bg:#eceeef;--card:#fff;--acc:#e8590c;--mute:#5d6b75}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
header{background:var(--steel);color:#fff;padding:28px 20px}
header h1{margin:0;font-size:26px;font-weight:900;letter-spacing:.02em}
header p{margin:4px 0 0;opacity:.8;font-size:14px}
main{max-width:1000px;margin:0 auto;padding:20px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:4px;font:inherit;cursor:pointer}
.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;overflow:hidden;text-decoration:none;color:inherit;display:block}
.ph{aspect-ratio:4/3;background:#cfd5d9 center/cover;display:flex;align-items:center;justify-content:center;font-size:40px;position:relative}
.tag{position:absolute;left:0;top:12px;background:var(--acc);color:#fff;font-size:13px;font-weight:700;padding:2px 12px}
.tag.done{background:var(--mute)}
.info{padding:14px 16px}
.info h3{margin:0 0 4px;font-size:17px}
.info .meta{color:var(--mute);font-size:14px}
.price{font-weight:900;font-size:20px;color:var(--acc);margin-top:6px}
table{width:100%;border-collapse:collapse;background:var(--card);margin:16px 0}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{width:30%;color:var(--mute);font-weight:500}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:4px}
.line{position:fixed;left:0;right:0;bottom:0;background:#06c755;color:#fff;text-align:center;padding:16px;font-weight:700;font-size:17px;text-decoration:none}
.back{display:inline-block;margin-bottom:12px;color:var(--steel)}
footer{padding:28px 20px 90px;text-align:center;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header><h1>仁武工業不動產</h1><p>廠房・土地・工業用地｜高雄</p></header>
<main id="app"></main>
<footer>【富茂通商用不動產股份有限公司｜楊紘珉｜(114)登字第486430號】<br>本網站資料僅供參考，實際內容以現場及契約為準</footer>
<script>
const LINE_ID="@447lrpzt";
const lineUrl=(l)=>"https://line.me/R/oaMessage/"+LINE_ID+"/?"+encodeURIComponent("我想詢問物件 "+l.id+"｜"+l.title);
const $=document.getElementById("app");
let all=[],flt="全部";
fetch("listings.json").then(r=>r.json()).then(d=>{all=d;route()}).catch(()=>{$.textContent="資料載入失敗，請稍後再試。"});
window.addEventListener("popstate",route);
function route(){
  const id=new URLSearchParams(location.search).get("id");
  const l=all.find(x=>x.id===id);
  l?detail(l):list();
}
function cover(l){const p=(l.photos||[])[0];return p?`background-image:url('${p}')`:""}
function list(){
  document.title="工業不動產物件｜仁武・高雄";
  const types=["全部","售","租"];
  const rows=all.filter(l=>flt==="全部"||l.type===flt);
  $.innerHTML=`<div class="filters">${types.map(t=>`<button class="${t===flt?"on":""}" onclick="setF('${t}')">${t==="全部"?t:"出"+t}</button>`).join("")}</div>
  <div class="grid">${rows.map(l=>`<a class="card" href="?id=${l.id}" onclick="go(event,'${l.id}')">
   <div class="ph" style="${cover(l)}">${(l.photos||[])[0]?"":"🏭"}<span class="tag ${l.status==="已成交"?"done":""}">${l.status==="已成交"?"已成交":"出"+l.type}</span></div>
   <div class="info"><h3>${l.title}</h3><div class="meta">${l.area}｜${l.zoning}｜土地 ${l.land_ping} 坪｜建坪 ${l.build_ping} 坪</div><div class="price">${l.price}</div></div></a>`).join("")||"目前沒有物件"}</div>`;
}
function setF(t){flt=t;list()}
function go(e,id){e.preventDefault();history.pushState({},"","?id="+id);route();scrollTo(0,0)}
function detail(l){
  document.title=l.title+"｜工業不動產";
  const rows=[["編號",l.id],["區域",l.area],["價格",l.price],["使用分區",l.zoning],["基地面積",l.land_ping?l.land_ping+" 坪":""],["建物面積",l.build_ping?l.build_ping+" 坪":""],["備註",l.note]].filter(r=>r[1]);
  $.innerHTML=`<a class="back" href="./" onclick="event.preventDefault();history.pushState({},'','./');route()">← 回物件列表</a>
  <h2>${l.title}</h2>
  <div class="gal">${(l.photos||[]).map(p=>`<img src="${p}" loading="lazy" alt="">`).join("")}</div>
  <table>${rows.map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join("")}</table>
  <p>${(l.desc||"").split("；").map(x=>"・"+x).join("<br>")}</p>
  ${l.status==="已成交"?"":`<a class="line" href="${lineUrl(l)}">LINE 詢問這個物件</a>`}`;
}
</script>
</body>
</html>
